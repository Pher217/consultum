<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 560" width="1000" height="560" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" role="img" aria-label="consultum advisory channel: cheap workers ask up to a stronger advisor through a curator that redacts secrets and compresses context">
  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0.5,0.5 L9,5 L0.5,9.5" fill="none" stroke="#b7b1a3" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <marker id="ahd" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0.5,0.5 L9,5 L0.5,9.5" fill="none" stroke="#a5492f" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <rect x="16" y="16" width="968" height="528" rx="26" fill="#f5f1e8"/>

  <!-- Workers -->
  <rect x="92" y="150" width="316" height="150" rx="16" fill="#ffffff" stroke="#b7b1a3" stroke-width="1.5"/>
  <text x="250" y="205" text-anchor="middle" font-size="32" font-weight="600" fill="#2b2a27">Workers</text>
  <text x="250" y="242" text-anchor="middle" font-size="19" font-family="Georgia, 'Times New Roman', serif" font-style="italic" fill="#2b2a27">local · hosted · any provider</text>
  <text x="250" y="272" text-anchor="middle" font-size="11.5" font-weight="500" letter-spacing="0.7" fill="#6f6b61">CHEAP · ISOLATED · RUN EVERY TURN</text>

  <!-- Advisor -->
  <rect x="592" y="150" width="316" height="150" rx="16" fill="#cd6544" stroke="#a5492f" stroke-width="2" stroke-dasharray="7 5"/>
  <text x="750" y="205" text-anchor="middle" font-size="32" font-weight="600" fill="#ffffff">Advisor</text>
  <text x="750" y="242" text-anchor="middle" font-size="20" font-family="Georgia, 'Times New Roman', serif" font-style="italic" fill="#ffffff">frontier model</text>
  <text x="750" y="272" text-anchor="middle" font-size="11.5" font-weight="500" letter-spacing="0.7" fill="#ffffff" opacity="0.92">ON-DEMAND · READ-ONLY</text>

  <!-- Curator -->
  <rect x="330" y="388" width="340" height="120" rx="14" fill="#ece7db" stroke="#ddd7c9" stroke-width="1.5"/>
  <text x="500" y="428" text-anchor="middle" font-size="22" font-weight="600" fill="#2b2a27">Curator</text>
  <text x="500" y="457" text-anchor="middle" font-size="17" font-family="Georgia, 'Times New Roman', serif" font-style="italic" fill="#2b2a27">high-context model</text>
  <text x="500" y="484" text-anchor="middle" font-size="11.5" font-weight="500" letter-spacing="0.7" fill="#6f6b61">COMPRESS · REDACT SECRETS</text>

  <!-- Main loop -->
  <path d="M92,232 h-34 a14,14 0 0 0 -14,14 v14 a14,14 0 0 0 14,14 h34" fill="none" stroke="#b7b1a3" stroke-width="2" marker-end="url(#ah)"/>
  <text x="30" y="222" text-anchor="middle" font-size="11" font-weight="500" letter-spacing="0.7" fill="#6f6b61">MAIN</text>
  <text x="30" y="236" text-anchor="middle" font-size="11" font-weight="500" letter-spacing="0.7" fill="#6f6b61">LOOP</text>

  <!-- Workers -> Curator -->
  <path d="M250,300 C250,352 340,360 430,388" fill="none" stroke="#b7b1a3" stroke-width="2" marker-end="url(#ah)"/>
  <rect x="256" y="338" width="140" height="26" rx="7" fill="#f5f1e8"/>
  <text x="326" y="356" text-anchor="middle" font-size="14" font-weight="600" fill="#2b2a27">stuck → packet</text>

  <!-- Curator -> Advisor -->
  <path d="M670,430 C716,414 745,360 749,302" fill="none" stroke="#a5492f" stroke-width="2" stroke-dasharray="2 6" stroke-linecap="round" marker-end="url(#ahd)"/>
  <rect x="662" y="338" width="126" height="26" rx="7" fill="#f5f1e8"/>
  <text x="725" y="356" text-anchor="middle" font-size="14" font-weight="600" fill="#2b2a27">clean packet</text>

  <!-- Advisor -> Workers -->
  <path d="M592,196 H408" fill="none" stroke="#a5492f" stroke-width="2" stroke-dasharray="2 6" stroke-linecap="round" marker-end="url(#ahd)"/>
  <rect x="416" y="184" width="168" height="26" rx="7" fill="#f5f1e8"/>
  <text x="500" y="202" text-anchor="middle" font-size="14" font-weight="600" fill="#2b2a27">read-only advice</text>
</svg>
