name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        node: [20, 22]
      fail-fast: false
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
      # No live provider keys: the redaction regression, adapter contract tests, and e2e run
      # entirely against injected fakes. Secrets never touch CI.
      - run: npm ci
      - run: npm run lint
      - run: npm test
      # The packed-tarball contract suite drives the installed binary + tsc through Unix-oriented
      # spawn/paths; run it on Linux + macOS. Windows cross-platform coverage comes from `npm test`
      # (unit + typecheck) above, which runs on every matrix combo.
      - run: npm run test:contract
        if: runner.os != 'Windows'
