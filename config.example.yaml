# askup — minimal working config. Secrets live in env vars, never here.
# trust: local | trusted | untrusted   (a sensitive request uses trusted/local only)
models:
  claude:  { provider: anthropic-cli, id: claude-claude-4-8, trust: trusted }   # subscription token or ANTHROPIC_API_KEY
  gpt:   { provider: openai,        id: gpt-4o,          trust: untrusted } # request-shaped; OPENAI_API_KEY
  local: { provider: ollama,        id: gemma3:27b,      trust: local }     # localhost, no key
roles:
  advisor: [claude, gpt]        # ordered fallback chain — first reachable wins
  # curator: local            # optional; omit to use the deterministic template builder
policy:
  default_sensitive: false    # sensitive => only trusted/local advisors are eligible
# NOTE: `codex-cli` also exists, but `codex exec -s read-only` is a READ-CAPABLE agent, not a no-tools
# advisor — prefer `openai` for a request-shaped OpenAI advisor. See docs/threat-model.md.
# Keychain-free auth: add `api_key_file: <path>` (HTTP) or `token_file: <path>` (anthropic-cli) to a
# model; env var wins over file. Inside a sandbox, see docs/sandboxed-callers.md.
